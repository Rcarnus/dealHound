# Exemple de mission dealHound (versionné). Les vraies missions vivent dans
# missions/<nom>/ et sont ignorées par git.
#
#   mkdir -p missions/<nom> && cp examples/mission/* missions/<nom>/
#   python collect.py --mission <nom> --dry-run -v
name: exemple-guitare
description: >
  Je cherche une Fender Stratocaster (Mexique ou USA), bon état, idéalement
  avec étui. Éviter les copies et les modèles Squier.

# ---------------------------------------------------------------------------
# Critères de RECHERCHE : filtres envoyés aux sources (ce qui est collecté).
# Communs à toutes les sources :
filters:
  query: "fender stratocaster"
  # price_min: 200
  price_max: 800
  location:                 # centre + rayon ; reprendre le domicile de context/profil.md
    city: Toulouse
    lat: 43.6045
    lng: 1.4440
    radius_km: 100

# Sources activées, avec leurs filtres propres (écrasent les filtres communs).
# Clés possibles : docstring de build_search_kwargs (dealhound/sources/leboncoin.py).
sources:
  leboncoin:
    category: "30"          # "0" toutes, "2" voitures, "30" instruments de musique
    max_pages: 2            # 35 annonces par page
    # sort: newest          # newest | cheapest | relevance
    # owner_type: private   # pro | private | all
    # title_only: true      # chercher les mots-clés dans le titre seulement
    #
    # Filtres serveur avancés : les clés sont les clés d'attributs des annonces.
    # Exemple voiture (category "2") :
    # enums:
    #   u_car_brand: [TOYOTA]
    #   u_car_model: [TOYOTA_Corolla]
    #   fuel: ["6"]           # 6 hybride, 8 hybride rechargeable, 2 diesel
    #   vehicle_type: [break]
    # ranges:
    #   regdate: {min: 2020}
    #   mileage: {max: 160000}

# ---------------------------------------------------------------------------
# Critères de NOTATION : comment l'analyse (claude -p, sur le serveur) classe les
# annonces collectées. Chaque critère est noté 0-10 ; la note globale est la moyenne
# pondérée. Le prompt complet (barèmes détaillés, red flags, cas éliminatoires) est
# dans scoring.md, à côté de ce fichier.
scoring:
  criteria:
    - id: prix              # slug : a-z, 0-9, _
      label: Prix
      weight: 3
      description: "10 = nettement sous le marché pour l'état ; 5 = prix du marché ; 0 = au-dessus du budget"
    - id: modele
      label: Modèle / version
      weight: 2
      description: "10 = USA ou Mexique, série recherchée ; 5 = version correcte ; 0 = Squier ou copie"
    - id: etat
      label: État
      weight: 2
      description: "10 = comme neuve, d'origine ; 5 = traces d'usage normales ; 0 = à réparer ou modifiée"
    - id: distance
      label: Distance
      weight: 1
      description: "10 = < 20 km du domicile ; 5 = ~60 km ; 0 = > 150 km sans envoi possible"
    - id: confiance
      label: Confiance vendeur
      weight: 1
      description: "10 = annonce complète, photos réelles, remise en main propre ; 0 = signaux d'arnaque"

notify:
  min_score: 8
